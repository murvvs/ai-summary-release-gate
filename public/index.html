<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    button { padding: .5rem .9rem; margin-right: .4rem; }
    blockquote { background: #f3f4f6; margin: 1rem 0; padding: .75rem 1rem; }
    #status { min-height: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="ticket-title"></h1>
    <ul id="messages" aria-label="Ticket messages"></ul>

    <section aria-label="AI summary">
      <button id="generate">Generate summary</button>
      <p id="status" role="status"></p>
      <blockquote id="summary" data-testid="summary" hidden></blockquote>
      <button id="retry" hidden>Retry</button>
      <button id="approve" disabled>Approve summary</button>
      <p id="approved" hidden>Summary approved</p>
    </section>
  </main>
  <script src="/config.js"></script>
  <script src="/tickets.js"></script>
  <script src="/rules.js"></script>
  <script src="/app.js"></script>
</body>
</html>
